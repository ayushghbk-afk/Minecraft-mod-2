name: Build Bedrock add-on

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and validate .mcaddon
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate pack source and placeholder art
        run: |
          python scripts/build_bedrock_expansion.py
          python generate_placeholders.py

      - name: Check generated files are committed
        run: git diff --exit-code

      - name: Build the importable add-on
        run: python scripts/package_bedrock_expansion.py

      - name: Validate the add-on
        run: python scripts/validate_bedrock_expansion.py

      - name: Upload .mcaddon artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedrockExpansion-addon
          path: releases/BedrockExpansion-*.mcaddon
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built add-on
        uses: actions/download-artifact@v4
        with:
          name: BedrockExpansion-addon
          path: release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.mcaddon \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.mcaddon \
              --repo "$GITHUB_REPOSITORY" \
              --title "Bedrock Expansion $GITHUB_REF_NAME" \
              --generate-notes
          fi
